<title>Cronogramas Everest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500&display=swap">
<style>
/* Layout: barra fixa no topo, resumo de status que também filtra, calendário mensal (lista no celular), gaveta lateral com o post e os comentários.
   Tokens no padrão shadcn/ui (tema zinc, raio 0.5rem). Tipografia: Avenir regular. */
:root{
  --background:#FFFFFF; --foreground:#09090B; --muted:#F4F4F5; --muted-foreground:#71717A;
  --border:#E4E4E7; --primary:#18181B; --primary-foreground:#FAFAFA; --ring:#A1A1AA;
  --ok:#10B981; --wait:#F59E0B; --fix:#EF4444; --hold:#A1A1AA; --done:#3B82F6; --anim:#8B5CF6;
  --radius:.5rem;
  --font:"Avenir","Avenir Next","Avenir LT Std","Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 38px rgba(9,9,11,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --background:#09090B; --foreground:#FAFAFA; --muted:#1F1F23; --muted-foreground:#A1A1AA;
  --border:#27272A; --primary:#FAFAFA; --primary-foreground:#18181B; --ring:#52525B;
  --ok:#34D399; --wait:#FBBF24; --fix:#F87171; --hold:#71717A; --done:#60A5FA; --anim:#A78BFA;
  --shadow:0 10px 38px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --background:#09090B; --foreground:#FAFAFA; --muted:#1F1F23; --muted-foreground:#A1A1AA;
  --border:#27272A; --primary:#FAFAFA; --primary-foreground:#18181B; --ring:#52525B;
  --ok:#34D399; --wait:#FBBF24; --fix:#F87171; --hold:#71717A; --done:#60A5FA; --anim:#A78BFA;
  --shadow:0 10px 38px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font);font-weight:400;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--background)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--background);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px}
.brand{min-width:0;flex:1 1 240px}
.brand small{display:block;font-size:12px;color:var(--muted-foreground)}
.brand h1{font-size:18px;font-weight:500;margin:0;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground)}
/* Tabs */
.seg{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main.wrap{padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted-foreground);margin:0;max-width:75ch}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--muted);gap:2px}
.bar span{display:block;min-width:2px;border-radius:2px}
.tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.s-aprovado{--c:var(--ok)} .s-em_aprovacao{--c:var(--wait)} .s-ajuste{--c:var(--fix)}
.s-insumos{--c:var(--hold)} .s-postado{--c:var(--done)} .s-anim{--c:var(--anim)}
.s-none{--c:transparent}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.s-none .dot,.pill.s-none::before,.ev.s-none::before{box-shadow:inset 0 0 0 1px var(--ring)}
/* Badge (outline) */
.chip,.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--background);border-radius:999px;white-space:nowrap}
.chip{padding:4px 11px;font-size:13px}
.chip b{font-weight:400;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.chip:hover{background:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.pill{padding:1px 9px;font-size:12px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px}
.cal .dow{background:var(--background);padding:8px;font-size:12px;color:var(--muted-foreground)}
.day{background:var(--background);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.off{background:var(--muted)}
.day .num{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;padding:0 2px 2px}
.day.today .num{color:var(--primary-foreground);background:var(--primary);border-radius:999px;padding:0 7px;align-self:flex-start;margin-bottom:2px}
.ev{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;border-radius:calc(var(--radius) - 2px);padding:3px 6px;background:none;font-size:13px;min-width:0}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.ev:hover,.row:hover{background:var(--muted)}
.ev span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ev .mk{font-size:11px;flex:none;color:var(--muted-foreground)}
.ev.dim,.row.dim{opacity:.25}

/* lista */
.list{display:flex;flex-direction:column;gap:20px}
.grp h2{font-size:13px;font-weight:400;color:var(--muted-foreground);margin:0 0 6px}
.rows{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:none;padding:8px 12px}
.row:first-child{border-top:0}
.row .th{width:30px;height:40px;border-radius:4px;flex:none;object-fit:cover;background:var(--muted);border:1px solid var(--border)}
.row .f{width:76px;flex:none}
.row .sum{flex:1 1 200px;min-width:0;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnt{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted-foreground)}

@media (max-width:760px){
  #cal{display:none}
  #list[hidden]{display:flex!important}
  #viewseg{display:none}
}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:21;background:var(--background);border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px}
.dh h2{font-size:18px;font-weight:500;margin:0;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.dh small{display:block;font-size:13px;font-weight:400;color:var(--muted-foreground);letter-spacing:0}
.x{border:0;background:none;border-radius:calc(var(--radius) - 2px);width:30px;height:30px;font-size:18px;line-height:1;flex:none;color:var(--muted-foreground)}
.x:hover{background:var(--muted);color:var(--foreground)}
.db{overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:20px;flex:1}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl select,.tog{border:1px solid var(--border);background:var(--background);border-radius:calc(var(--radius) - 2px);padding:6px 10px;height:34px;font-size:13px}
.tog:hover{background:var(--muted)}
.tog[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.sec h3{font-size:13px;color:var(--muted-foreground);margin:0 0 6px;font-weight:400}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.sec a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.frames{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.frame{position:relative;flex:none;height:300px;border-radius:var(--radius);border:1px solid var(--border);cursor:crosshair;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--muted) 0 10px,var(--background) 10px 20px);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--muted-foreground)}
.frame.v{aspect-ratio:9/16} .frame.q{aspect-ratio:4/5}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.frame span.lb{position:relative;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--background);pointer-events:none}
.pin.new{background:var(--background);color:var(--foreground);box-shadow:0 0 0 2px var(--primary)}
.pin.ok{background:var(--ok);color:#fff}
.files{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sec a.file{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--border);text-decoration:none;font-size:13px}
.sec a.file:first-child{border-top:0}
.sec a.file:hover{background:var(--muted)}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .go{color:var(--muted-foreground);font-size:12px;white-space:nowrap}
.cm{display:flex;flex-direction:column;gap:8px}
.c{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.c.done{opacity:.55}
.c .hd{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted-foreground)}
.c .hd b{color:var(--foreground);font-weight:500;font-size:13px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--muted);color:var(--muted-foreground)}
.c p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{border:0;background:none;color:var(--foreground);padding:0;font-size:12px;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.df{border-top:1px solid var(--border);padding:12px 20px;display:flex;flex-direction:column;gap:8px}
.df textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:8px 10px;background:var(--background)}
.df textarea::placeholder{color:var(--muted-foreground)}
.df .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.df .r .pinmsg{font-size:12px;color:var(--muted-foreground);flex:1;min-width:0}
.btn{border:0;background:var(--primary);color:var(--primary-foreground);border-radius:calc(var(--radius) - 2px);padding:0 16px;height:34px;font-size:13px}
.btn:hover{opacity:.9}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}


/* ---------- visão macro: canvas de meses, interface em texto nos quatro cantos ---------- */
html.home,html.home body{height:100%;overflow:hidden;overscroll-behavior:none}
.board{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mlist{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.mlist:focus-within{position:fixed;z-index:4;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:auto;height:auto;clip-path:none;background:var(--background);padding:4px 10px;display:flex;gap:12px}
.board.drag{cursor:grabbing}
.corner{position:fixed;z-index:3;background:var(--background);padding:4px 8px;font-size:14px;display:flex;align-items:center;gap:12px}
.corner.tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
.corner.tr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.corner.bl{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:calc(10px + env(safe-area-inset-left,0px));color:var(--muted-foreground);font-size:13px}
.corner.br{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.corner b{font-weight:500}.corner .mut{color:var(--muted-foreground)}
@media (max-width:640px){.corner.bl,.corner.tl .mut{display:none}.mebar .me span.nm{display:none}}

/* ---------- barra de perfil ---------- */
.mebar{display:flex;align-items:center;gap:14px;font-size:13px}
.tbtn{all:unset;cursor:pointer;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{color:var(--foreground)}
.tbtn:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.badge{background:var(--fix);color:#fff;border-radius:999px;font-size:11px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 5px}
.me{display:inline-flex;align-items:center;gap:7px}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
.banner{font-size:13px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--muted-foreground);margin:0}
.back{all:unset;cursor:pointer;color:var(--muted-foreground);font-size:13px}
.back:hover{color:var(--foreground)}

/* ---------- visão slides: um slide por post ---------- */
.slides{display:flex;flex-direction:column;gap:20px}
.slide{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;aspect-ratio:16/9;background:var(--background)}
.sl-l{padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow-y:auto}
.sl-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted-foreground)}
.sl-l h3{margin:0;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.sl-t h4{margin:0 0 3px;font-size:12px;font-weight:400;color:var(--muted-foreground)}
.sl-t p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.sl-t a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.sl-foot{margin-top:auto;padding-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.sl-r{background:var(--muted);display:flex;gap:12px;padding:22px;overflow-x:auto;align-items:stretch;min-width:0}
.sl-r .frame{height:auto;align-self:stretch;cursor:default}
.sl-r .frame:only-child{margin:0 auto}
.noart{margin:auto;color:var(--muted-foreground);font-size:13px}
.btn.ghost{background:none;color:var(--foreground);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--muted);opacity:1}
@media (max-width:820px){.slide{grid-template-columns:1fr;aspect-ratio:auto}.sl-r{height:340px;order:-1}.sl-l{padding:18px}}

/* ---------- mídia enviada, menções, painéis ---------- */
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.frame.dv{cursor:pointer;text-decoration:none;color:var(--foreground)}
.frame.dv .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px;padding-left:3px}
.frame.dv:hover .play{background:rgba(0,0,0,.85)}
.sl-r .frame.dv{cursor:pointer}
.frame .spr{position:absolute;inset:0;background-repeat:no-repeat}
.corner.tc{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:0}
.tm{display:flex;flex-direction:column;gap:10px}
.tmh{all:unset;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--muted-foreground)}
.tmh b{font-size:18px;font-weight:500;color:var(--foreground);letter-spacing:-.01em}
.tmh .go{margin-left:auto}
.tmh:hover .go{color:var(--foreground)}
.tmh:focus-visible{outline:2px solid var(--ring);outline-offset:4px}
.tgrid{display:flex;flex-wrap:wrap;gap:8px}
.pt{all:unset;box-sizing:border-box;position:relative;height:124px;border-radius:4px;overflow:hidden;cursor:pointer;background:var(--muted);flex:none;display:block}
.pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.pt .spr{position:absolute;inset:0;background-repeat:no-repeat}
.pt.none{border:1px dashed var(--border);background:none;display:grid;place-items:center;font-size:11px;color:var(--muted-foreground)}
.pt .pv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:9px;display:grid;place-items:center;padding-left:2px}
.pt .dot{position:absolute;right:5px;bottom:5px;box-shadow:0 0 0 2px var(--background)}
.pt:hover{outline:2px solid var(--foreground);outline-offset:1px}
.pt:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.row span.th{background-repeat:no-repeat;display:block}
.frame .rm{all:unset;cursor:pointer;position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--background);border:1px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--foreground)}
.frame .vtag{position:absolute;top:6px;left:6px;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:11px;color:var(--foreground)}
.up{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);margin-top:6px}
.up label{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:5px 10px;cursor:pointer;color:var(--foreground);font-size:13px}
.up label:hover{background:var(--muted)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--muted);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px}
.mchip button{all:unset;cursor:pointer;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;color:var(--muted-foreground)}
.at{color:var(--done)}
.mpick{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:190px;overflow-y:auto}
.mpick button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;cursor:pointer;font-size:13px}
.mpick button:hover,.mpick button:focus-visible{background:var(--muted)}
.mpick .none{padding:8px 10px;font-size:12px;color:var(--muted-foreground)}
.plist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);min-width:0}
.prow:first-child{border-top:0}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow select{border:1px solid var(--border);background:var(--background);border-radius:calc(var(--radius) - 2px);padding:4px 8px;font-size:13px}
button.prow{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer;width:100%}
button.prow:first-child{border-top:0}
button.prow:hover{background:var(--muted)}
.prow.unread .t{font-weight:500}
.prow .t{font-size:13px}.prow .s{font-size:12px;color:var(--muted-foreground);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--primary);color:var(--primary-foreground);padding:8px 14px;border-radius:var(--radius);font-size:13px;max-width:calc(100% - 32px)}
</style>

<div id="app"></div>
<div id="overlay"></div>

<script>

:true,"title":"Stories de 19","legenda":"","insight":"","textos":"Como limpar o meu purificador?\n\nDeve ser limpo pelo menos uma vez por semana ou quando houver problema na saída de água\nDesrosqueie o bico e use algodão umedecido com álcool 70%\nRemova a pingadeira e use água corrente e detergente na limpeza\nPasse um pano úmido em toda a parte externa\nAo finalizar a limpeza, retire todo excesso de álcool ligando o purificador e descartando o primeiro copo","refs":"","imgs":[],"sp":[],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p27","month":"maio","day":19,"fmt":"card","status":"em_aprovacao","animar":false,"frames":0,"vertical":false,"title":"A convocação está feita.","legenda":"A convocação está feita.\nOnze em campo, cada um com sua função. Da defesa ao ataque, da hidratação à performance. E por trás de tudo isso, um sistema que não aparece no placar, mas define o jogo: a água.\n\nEverest em campo e na torcida pelo Hexa.","insight":"","textos":"","refs":"","imgs":[],"sp":[[2,2,2,405,506]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p28","month":"maio","day":19,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Stories de 19","legenda":"","insight":"","textos":"2 pints de cerveja  ≈ 3 a 4 copos americanos de água\n\nFonte: Water Footprint of Food Guide\n1 drink tipo gin ou caipirinha ≈ 2 copos americanos de água\n\nFonte: Water Footprint of Food Guide","refs":"","imgs":[],"sp":[],"vids":["1UV5F2Arnir6DUZnbFjir-ortFppVMf3a","1_aCqu9D1Vpc5FqrOyrgWPHqzkQXdbwc2","16f0d6Av1WX8F3gkix-3G_scKMiPKXjfV"],"files":[],"vcs":{"1UV5F2Arnir6DUZnbFjir-ortFppVMf3a":["v0",1,2,404,720],"1_aCqu9D1Vpc5FqrOyrgWPHqzkQXdbwc2":["v0",2,2,405,720],"16f0d6Av1WX8F3gkix-3G_scKMiPKXjfV":["v0",3,2,404,720]},"vc":[]},{"id":"maio-p29","month":"maio","day":19,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Stories de 19","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[],"vids":["1RrEQlewK5sVb_ que falavam sobre o rio tinham uma performance melhor que os demais e aqueles posts que traziam dados sobre a situação também tinham maior desempenho. Aliado a trend que vem surgindo na gringa com fotos de “antes vs depois”, tivemos a ideia deste conteúdo.","textos":"","refs":"","imgs":[],"sp":[],"vids":["1oHgI3XG_1a9Z9nWPwsOHrnj4JK-upJ6_"],"files":[],"vcs":{"1oHgI3XG_1a9Z9nWPwsOHrnj4JK-upJ6_":["v0",3,1,405,720]},"vc":[]},{"id":"maio-p22","month":"maio","day":23,"fmt":"card","status":"postado","animar":false,"frames":0,"vertical":false,"title":"COMPARTILHAR NOS STORIES / THAIS","legenda":"Mais um ano onde vamos marcar presença na Fispal, a principal feira de alimentos e bebidas da América Latina. \n\nEssa é mais uma oportunidade para trocar experiências e apresentar as soluções da Everest. \n\nDe 26 a 29 de maio, no Distrito Anhembi, em São Paulo. Estamos localizados na posição K65, no Pavilhão 3, com melhor acesso pela Doca D.\n\nNos vemos lá?","insight":"","textos":"COMPARTILHAR NOS STORIES / THAIS","refs":"","imgs":[],"sp":[[1,2,3,405,506]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p23","month":"maio","day":24,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Stories de 24","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[[1,3,3,405,718],[2,0,0,405,718]],"vids":["1NTr9i7ciiM9Kx8MhWxQHe8NKtzjCWlCZ"],"files":[],"vcs":{"1NTr9i7ciiM9Kx8MhWxQHe8NKtzjCWlCZ":["v0",0,2,404,720]},"vc":[]},{"id":"maio-p20","month":"maio","day":25,"fmt":"reels","status":"none","animar":false,"frames":0,"vertical":true,"title":"SÓ ACEITAR COLLAB RAFA KALIMANN","legenda":"Um futuro com mais consciência nas pequenas escolhas, mais cuidado com o planeta e mais responsabilidade com o que deixamos para as próximas gerações é o que precisamos priorizar.\n\nO futuro também é construído nos pequenos detalhes. E como mãe, não posso deixar de olhar pra isso. \n\nE poder fazer parte de um projeto como o Água da Casa, ao lado @everestoficial_, faz tudo isso ganhar ainda mais sentido pra mim. Ver iniciativas que incentivam escolhas mais conscientes também fora de casa mostra que pequenas mudanças podem gerar grandes impactos.\n\n*Publi","insight":"","textos":"SÓ ACEITAR COLLAB RAFA KALIMANN","refs":"","imgs":[],"sp":[],"vids":["1MlnoHbkOIqXwqY8QyJICkk5XLGpCD0AG"],"files":[],"vcs":{"1MlnoHbkOIqXwqY8QyJICkk5XLGpCD0AG":["v0",2,1,405,228]},"vc":[]},{"id":"maio-p18","month":"maio","day":26,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Ainda em dúvida qual dia eu vou","legenda":"","insight":"","textos":"Ainda em dúvida qual dia eu vou\nvou ter que deixar para \na próxima :/\nJá estou pronta pra ir","refs":"","imgs":[],"sp":[[1,0,2,405,720],[1,1,2,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p19","month":"maio","day":26,"fmt":"carrossel","status":"postado","animar":false,"frames":0,"vertical":false,"title":"Tecnologia de verdade é aquela que você percebe no dia a dia. No…","legenda":"Tecnologia de verdade é aquela que você percebe no dia a dia. No silêncio, na economia, na constância e na confiança de saber que o desempenho acompanha o seu ritmo.\n\nCom o novo Everest Plus Inverter +, inovação deixa de ser promessa e passa a fazer parte do dia a dia. \n\nVenda exclusiva nas revendas autorizadas Everest.","insight":"","textos":"","refs":"","imgs":[],"sp":[[1,2,2,405,498],[1,3,2,405,498],[1,0,3,405,498],[1,1,3,405,507]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p14","month":"maio","day":27,"fmt":"carrossel","status":"aprovado","animar":false,"frames":0,"vertical":false,"title":"ADD MÚSICA AO SUBIR","legenda":"Alta tecnologia, desempenho constante e padrão de qualidade que é referência no mercado. Isso é Everest.\n\nE tem gente que não acredita quando a gente diz que não é só uma Máquina de Gelo…  \n\nSe você quiser saber qual é o modelo ideal para o seu negócio, é só falar com a gente na Fispal. Estamos localizados na posição K65, no Pavilhão 3, com zinhar pode ser terapia ou caos. Entre panelas, cortes e temperos, todo mundo se divide em dois times: quem relaxa e quem se estressa. Mas tem algo que faz diferença em ambos os lados: água pura Everest, que garante o melhor sabor e tira a preocupação do caminho. Vamos usar o Dalton para contar um pouco sobre esses lados e como ele encara a vibe da cozinha.\n\nRoteiro: https://docs.google.com/document/d/1pJzNjj4kFKMKEOZ3Cm-69AK8ke-Vb4Fsc4LQD2vkQlo/edit?tab=t.0","textos":"","refs":"","imgs":[],"sp":[],"vids":["1BAhBlj93Mt9ZrJ8FfXBy5_pp9OhNXFT0"],"files":[],"vcs":{"1BAhBlj93Mt9ZrJ8FfXBy5_pp9OhNXFT0":["v0",2,0,405,720]},"vc":[]},{"id":"maio-p12","month":"maio","day":28,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Sou a própria Frozen","legenda":"","insight":"","textos":"Sou a própria Frozen\nOlaf teria orgulho de mim\nVOCÊ ENTENDE DE GELO\nOU SÓ USA?\nGelar rápido\nDerreter devagar\nO GELO PERFEITO PRECISA:\nTer um formato especial\nSer feito com água potável\nTodas as opções (no meu drink agora!)","refs":"","imgs":[],"sp":[[0,0,2,405,720],[0,1,2,405,720],[0,2,2,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p13","month":"maio","day":28,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Muda muito (fica até melhor)","legenda":"","insight":"","textos":"Muda muito (fica até melhor)\nNão muda nada\nO FORMATO DO GELO\nMUDA A BEBIDA?","refs":"","imgs":[],"sp":[[0,3,2,405,720],[0,0,3,405,720],[0,1,3,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"maio-p6","month":"maio","day":29,"fmt":"reels","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Último dia de feira e só podemos dizer que foram dias intensos e…","legenda":"Último dia de feira e só podemos dizer que foram dias intensos e corridos, mas como sempre, entregamos presença na @fispalfoodservice.\n\nE não dá pra falar da feira, sem falar da nossa máquina de gelo, né? A melhor do mercado é nossa. E ela foi uum":["v0",0,0,405,719]},"vc":[]},{"id":"junho-p52","month":"junho","day":2,"fmt":"card","status":"aprovado","animar":false,"frames":0,"vertical":false,"title":"A qualidade garantida que atravessa gerações. 💙💦","legenda":"A qualidade garantida que atravessa gerações. 💙💦","insight":"","textos":"Millennials comprando um purificador de água\n\nMáximo de eficiência e economia.\nÁgua pura e gelada o dia inteiro para você não perder tempo se preocupando com a qualidade da sua água. \nMais tempo para produtividade e menos com preocupações.\nGen z comprando um purificador de água\n\n\nA Everest é tudo, JUROOOO. \n\n(emoji de brilhos, coração azul e aguinhas em volta)","refs":"","imgs":[],"sp":[[3,2,1,405,506]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"junho-p53","month":"junho","day":2,"fmt":"reels","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Já parou pra pensar que aquele \"branco\" na memória pode não ser…","legenda":"Já parou pra pensar que aquele \"branco\" na memória pode não ser distração, mas sim desidratação? \n\nNosso cérebro é composto majoritariamente por água. Quando o corpo está desidratado, mesmo que pouco, funções como concentração, raciocínio e memória são diretamente afetadas. \n\nE o mais curioso? Muitas vezes você nem sente sede. \n\nCuidar da sua memória começa no básico: hidratação de qualidade. todos os dias. Porque água não é sobre matar a sede, é sobre bem-estar e cuidar de quem você é.","insight":"","textos":"","refs":"","imgs":[],"sp":[[3,3,1,405,506]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"junho-p51","month":"junho","day":3,"fmt":"reels","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Correr não começa no pace.","legenda":"Correr não começa no pace.\nComeça na decisão de sair de casa.\nPra quem tá começando: vá no seu ritmo, respeite seu corpo e não esqueça da hidratação no caminho. Com a Niva por perto, fica mais fácil transformar pequenos passos em rotina.","insight":"","textos":"","ref a define o quanto ainda teremos amanhã.\n\nÉ por acreditar no poder da conscientização que  temos o projeto Águas que Falam, uma iniciativa que transforma dados, histórias e informação em um convite à reflexão sobre nossa relação com a água. Porque preservar esse recurso começa com algo simples: ouvir os sinais que ela nos dá.","insight":"Fazer um antes x depois com fotos e/ou vídeo que mostre um mundo caso a água acabe algum dia. A intenção é conscientizar o usuário sobre o impacto real que a escassez hídrica pode causar.","textos":"","refs":"","imgs":[],"sp":[[1,3,0,405,720]],"vids":["1luB7hfFM6skr_UnkrbGo8dAvUJ8-sNh4"],"files":[],"vcs":{"1luB7hfFM6skr_UnkrbGo8dAvUJ8-sNh4":["v0",1,3,405,719]},"vc":[]},{"id":"junho-p30","month":"junho","day":18,"fmt":"reels","status":"postado","animar":false,"frames":0,"vertical":true,"title":"“Girl Grip”","legenda":"Aquele momento que você precisa segurar apenas o necessário, mais alguém se identifica?","insight":"“Girl Grip”\nEntrando na trend com as fotos do shooting de Niva onde a mulher segura várias coisas ao mesmo tempo junto da Niva","textos":"","refs":"","imgs":[],"sp":[],"vids":["1zYPq53gaygrrO7z0slkaQDSf7ieqNE9q"],"files":[],"vcs":{"1zYPq53gaygrrO7z0slkaQDSf7ieqNE9q":["v0",0,3,405,719]},"vc":[]},{"id":"junho-p26","month":"junho","day":19,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"PLACAR DA HIDRATAÇÃO  🍺🍺🍺 = 💧","legenda":"","insight":"","textos":"PLACAR DA HIDRATAÇÃO\n\n🍺🍺🍺 = 💧","refs":"","imgs":[],"sp":[[0,2,1,405,720],[0,3,1,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"junho-p27","month":"junho","day":20,"fmt":"reels","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Seu purificador merece um parceiro certo e verdadeiro.","legenda":"Seu purificador merece um parceiro certo e verdadeiro. \n\nO Refil Original Everest foi desenvolvido especialmente para os purificadores da marca, ajudando a garantir desempenho, eficiência da filtragem e qualidade da Qcr7K0-8pUVpYNsI9GWjJ17":["v1",2,0,319,566]},"vc":[]},{"id":"julho-p23","month":"julho","day":22,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"O que é bom... não dura pouco.","legenda":"O que é bom... não dura pouco.\n\nDepois de décadas fazendo parte da casa dos brasileiros, chegou a hora de apresentar o nosso mais novo lançamento:\nConheça o FOZ, o novo purificador da Everest.\n\nÉ com experiência que se inova. E com inovação que a gente continua fazendo parte da sua casa.\n\nDescubra todos os detalhes no link da bio.","insight":"","textos":"Vídeo fábrica Lançamento Foz\nThumb/Capa","refs":"","imgs":[],"sp":[[0,1,3,405,720]],"vids":["1WumGeZ62a0mVwcFLIqasaefaJG-fWk1S"],"files":[],"vcs":{"1WumGeZ62a0mVwcFLIqasaefaJG-fWk1S":["v0",2,2,405,507]},"vc":[]},{"id":"julho-p24","month":"julho","day":22,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Stories de 22","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[],"vids":["1spDEa1gdGdzT7-bWgUUwLOiPHN7qwRJr","1wNeQeJBkkf0N-BB5qCcQ7-1_1wpsy02l"],"files":[],"vcs":{"1spDEa1gdGdzT7-bWgUUwLOiPHN7qwRJr":["v0",3,2,405,720],"1wNeQeJBkkf0N-BB5qCcQ7-1_1wpsy02l":["v0",0,3,405,719]},"vc":[]},{"id":"julho-p38","month":"julho","day":22,"fmt":"reels","status":"insumos","animar":false,"frames":0,"vertical":true,"title":"Trazer a Niva como protagonista em um vídeo simples de conteúdo,…","legenda":"A garrafa térmica que é muito mais que uma garrafa. Parceira pra todas as horas, Niva mantém sua água gelada por até 24 horas, não condensa e acompanha você em qualquer lugar.\n\nChama sua amiga pra curtir um rolê Niva junto.","insight":"Trazer a Niva como protagonista em um vídeo simples de conteúdo, onde duas amigas saem para um date e levam a garrafa junto. A cada brinde feito com garrafa, indica-se na tela a quantidade de água que elas já beberam. \n\nRoteiro: https://docs.google.com/document/d/1453dL-oN-uMJ7Pl5qtNK_RzOxlJMySAEQVXojdAvNMw/edit?tab=t.0","textos":"","refs":"","imgs":[],"sp":[],"vids":["153dpyMOkvEYuN3TYTvntcSL5WAbWYxj3"],"files":[],"vcs":{"153dpyMOkvEYuN3TYTvntcSL5WAbWYxj3":["v1",3,0,405,720]},"vc":[]},{"id":"julho-p16","month":"julho","day":23,"fmt":"card","status":"aprovado","animar":false,"frames":0,"vertical":false,"title":"COLÍRIO","legenda":"Tem gente que acredita que para saber inovar, é preciso ser muito jovem.\n\nA gente pensa o contrário.\n\nA inovação pode até vir da novidade, mas jamais existiria sem repertório. Sem a história de quem já passou por muitas fases e, ainda assim, continua encontrando formas de fazer diferente.\n\nFoi com essa ideia que nasceu o nosso mais novo purificador, o FOZ.\n\nEle reúne tudo o que sempre fez parte da Everest: desempenho, durabilidade, confiança… e acrescenta um toque importante: a inovação, que só é possível pra quem passou anos evoluindo e aperfeiçoando.\n\nPor isso, a campanha de lançamento não poderia ser diferente. Para dar vida a ela, escolhemos pessoas que carregam exatamente o que o FOZ representa para nós: trajetória e experiência.\n\nAqui, você vai conhecer influenciadores e colaboradores 50+ que mostram, todos os dias, que curiosidade não tem idade e que a experiência pode ser o ponto de partida para inovar, em qualquer fase da vida.\n\nO novo purificador FOZ é Everest.\nAcompanhe essa história com a gente e conheça de perto.","insight":"","textos":"COLÍRIO\nCOMUNICAÇÃO","refs":"","imgs":[],"sp":[[0,1,2,405,506],[0,0,2,405,262]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"julho-p22","month":"julho","day":23,"fmt":"stories","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"Stories de 23","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[],"vids":["1dvWrgLiOuh2_tVgGShLjGYPVZnzk6lzW"],"files":[],"vcs":{"1dvWrgLiOuh2_tVgGShLjGYPVZnzk6lzW":["v0",1,2,405,720]},"vc":[]},{"id":"julho-p42","month":"julho","day":23,"fmt":"reels","status":"em_aprovacao","animar":false,"frames":0,"vertical":true,"title":"Colocar um filtro Everest como se fosse um quebra cabeças com uma…","legenda":"A gente considera a peça principal que toda cozinha precisa ter.\nQualidade garantida para toda família 24h por dia.","insight":"Colocar um filtro Everest como se fosse um quebra cabeças com uma peça faltando.\nAnimar as peças que estão embaixo para encaixar e mostrar o texto na tela  “A peça que estava faltando na sua cozinha”\n\nTexto:\nA peça que estava faltando na sua cozinha","textos":"","refs":"","imgs":[],"sp":[[1,2,2,405,720]],"vids":["18t35MDg6EWg7xmMu525Q_7_xSPhp4uu4"],"files":[],"vcs":{"18t35MDg6EWg7xmMu525Q_7_xSPhp4uu4":["v1",2,1,405,720]},"vc":[]},{"id":"julho-p17","month":"julho","day":24,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Stories de 24","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[[0,1,0,405,720],[0,2,0,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"julho-p18","month":"julho","day":24,"fmt":"reels","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Dia internacional do autocuidado, falar das melhores maneiras de…","legenda":"Cuidar de você deve ser sempre a sua prioridade, por isso não esquece de ir lá encher a sua Niva e se manter hidratada, ta bom?","insight":"Dia internacional do autocuidado, falar das melhores maneiras de praticar o autocuidado no dia a dia com niva.\n\nrefs:\nhttps://www.instagram.com/p/DYpS3r1Cphy/\nhttps://www.instagram.com/p/DXhO_nMjXwc/","textos":"","refs":"","imgs":[],"sp":[],"vids":["1x3KISj0wPc2fz3X4G-owuZTOhouhrDNE"],"files":[],"vcs":{"1x3KISj0wPc2fz3X4G-owuZTOhouhrDNE":["v0",0,2,405,720]},"vc":[]},{"id":"julho-p19","month":"julho","day":25,"fmt":"carrossel","status":"postado","animar":false,"frames":0,"vertical":false,"title":"Carrossel de 25","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[[0,2,2,405,506],[0,3,2,405,506],[0,0,3,405,506]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"julho-p20","month":"julho","day":25,"fmt":"card","status": o, use esse lembrete para ir agora beber uma água. 🫵💧 \n\np.s: e aproveita para mandar para aquela amiga que está sempre precisando de um lembrete.","insight":"Usar um copo da água como se fosse um relógio com o ponteiro rodando para o lembrete de que é hora de parar e se hidratar.\n\nTexto:\n“Pare o que você está fazendo, é hora de se hidratar”","textos":"","refs":"","imgs":[],"sp":[[1,1,2,405,720]],"vids":["1VyJrzaqusQqKe67dDctZm1BuO-AGxOkO"],"files":[],"vcs":{"1VyJrzaqusQqKe67dDctZm1BuO-AGxOkO":["v1",1,1,405,720]},"vc":[]},{"id":"julho-p6","month":"julho","day":30,"fmt":"reels","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"VÍDEO PRODUTO IA","legenda":"Ele é tudo isso e muito mais.\n\nDisponível em 3 cores para combinar com sua cozinha e um alto desempenho com baixo consumo de energia.\n\nVenha conhecer de perto  o FOZ, o mais novo purificador da Everest.","insight":"","textos":"VÍDEO PRODUTO IA","refs":"","imgs":[],"sp":[[0,0,0,405,720]],"vids":["1KHheNlwceeA50VV57Lqaegz9QOdMb8Fy"],"files":[],"vcs":{"1KHheNlwceeA50VV57Lqaegz9QOdMb8Fy":["v0",2,0,405,228]},"vc":[]},{"id":"julho-p7","month":"julho","day":30,"fmt":"stories","status":"postado","animar":false,"frames":0,"vertical":true,"title":"Stories de 30","legenda":"","insight":"","textos":"","refs":"","imgs":[],"sp":[[0,1,0,405,720],[0,2,0,405,720]],"vids":[],"files":[],"vcs":{},"vc":[]},{"id":"julho-p3","month":"julho","day":31,"fmt":"reels","status":"aprovado","animar":false,"frames":0,"vertical":true,"title":"MAKING OFF FABRICA","legenda":"Quer ver o que rolou nos bastidores?\n\nPor trás do lançamento do FOZ tem muitas pessoas envolvidas. Vem conhecer algumas delas e entender como transformamos ideia em realidade.\n\nAproveita e conheça mais sobre o FOZ pelo link da bio.","insight":"","textos":"MAKING OFF FABRICA","refs":"","imgs":[],"sp":[],"vids":["1xREY0ICpdDhBYc6PqLEmdOmJiRK89R3A"],"files":[],"vcs":{"1xREY0ICpdDhBYc6PqLEmdOmJiRK89R3A":["v0",0,0,405,506]},"vc":[]},{"id":"julho-p39"," const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function linkify(text){
  const out = []; let last = 0;
  for (const m of text.matchAll(/https?:\/\/[^\s]+/g)) {
    out.push(text.slice(last, m.index));
    out.push(h('a', {href:m[0], target:'_blank', rel:'noopener', text:m[0].replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (m[0].length > 60 ? '…' : '')}));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last)); return out;
}

async function saveDoc(col, id, data){

  try { await db.doc(col + '/' + id).set(data); return true; }

function resolveProfiles(){
  if (!user) return;
  const ids = new Set(Object.keys(S.members));
  Object.values(S.comments).forEach(c => { ids.add(c.by); (c.mentions || []).forEach(i => ids.add(i)); });

  const miss = [...ids].filter(i => i && !asked.has(i));

  miss.forEach(i => asked.add(i));

}

// Meses em círculo; cada post é um ponto ligado ao seu mês. Desenhado em canvas, com arrastar e zoom.
const RING = 600, pan = {ptr:new Map(), moved:false, d0:0};
let G = null, hov = null, cv = null;
function buildGraph(){
  const nodes = [];
  MONTHS.forEach((m, i) => {
    const a = -Math.PI / 2 + i / MONTHS.length * 2 * Math.PI, hx = Math.cos(a) * RING, hy = Math.sin(a) * RING;
    const ps = POSTS.filter(p => p.month === m.k).sort((x, y) => (x.day || 99) - (y.day || 99));
    const hub = {isHub:true, m, x:hx, y:hy, r:5 + Math.sqrt(ps.length) * .8, n:ps.length, a};
    nodes.push(hub);
    ps.forEach((p, j) => {
      const rnd = s => { const v = Math.sin((i * 131 + j * 71 + s) * 12.9898) * 43758.5453; return v - Math.floor(v); }; // variação fixa, para o desenho não mudar a cada abertura
      const t = j * 2.39996 + i * 1.7 + (rnd(1) - .5) * .5, d = (34 + 20 * Math.sqrt(j + 1)) * (.82 + rnd(2) * .4), pcs = (p.imgs || []).length + (p.sp || []).length + (p.vids || []).length;
      nodes.push({p, hub, x:hx + Math.cos(t) * d, y:hy + Math.sin(t) * d, r:2 + Math.min(pcs, 10) * .22});
    });
  });
  return nodes;
}

async function sendComment(p){
  const ta = $('#comment-text'), text = ta.value.trim();
  if (!text) { ta.focus(); return; }

  ta.value = ''; ui.pin = null; ui.mentions = [];

  for (const to of mentions) if (to !== me.id) saveDoc('notifs', uid(), {to, by:me.id, postId:p.id, commentId:id, text:text.slice(0, 140), ts:Date.now(), read:false, emailed:false});

let pickT = 0;
function onType(e){
  const ta = e.target, m = /(^|\s)@([^\s@]{0,30})$/.exec(ta.value.slice(0, ta.selectionStart)), box = $('#mpick');
  if (!m) { box.replaceChildren(); return; }
  const q = m[2].toLowerCase(), t = ++pickT;
  const known = Object.keys(S.members).filter(i => i !== me.id && profiles[i]).map(i => profiles[i]);
  const show = list => {
    if (t !== pickT) return;
    const seen = new Set(ui.mentions), rows = list.filter(x => x && x.id && x.id !== me.id && !seen.has(x.id) && (seen.add(x.id), true) && (x.name || '').toLowerCase().includes(q)).slice(0, 8);
    box.replaceChildren(h('div', {class:'mpick'}, rows.length ? rows.map(x => h('button', {onclick:() => {
      profiles[x.id] = profiles[x.id] || x; ui.mentions.push(x.id);

    }}, h('img', {class:'av', src:x.avatarUrl, alt:''}), h('span', {text:x.name || 'Sem nome'}), x.guest && h('span', {class:'tag', text:'Convidado'}))) : h('div', {class:'none', text:user ? 'Ninguém encontrado com esse nome.' : 'Marcações funcionam no app publicado, com as pessoas que têm acesso.'})));
  };
  show(known);
  if (user) user.search(m[2]).then(hits => show([...known, ...hits]));
}
async function addMedia(p, files){
  if (!files.length) return;
  if (local) { toast('No modo demonstração o envio de arquivos fica desligado.'); return; }
  const big = files.filter(f => f.size > MAX_UP), ok = files.filter(f => f.size <= MAX_UP);
  if (big.length) toast(`${big.length > 1 ? 'Alguns arquivos passam' : big[0].name + ' passa'} de 20 MB. Exporte uma versão mais leve.`);
  if (!ok.length) return;
  ui.busy = true; renderDrawer();
  const media = [...((S.state[p.id] || {}).media || [])];
  for (const f of ok) {
    try { const r = await assets.upload(f); media.push({id:r.id, kind:r.contentType.startsWith('video') ? 'video' : 'image', name:f.name}); }
    catch (e) { toast(`Não foi possível enviar ${f.name}.`); }
  }
  ui.busy = false; await patchState(p, {media}); renderDrawer(true);
}
async function removeMedia(p, m){
  await patchState(p, {media:((S.state[p.id] || {}).media || []).filter(x => x.id !== m.id)});
  if (assets) assets.delete(m.id).catch(() => {});
}

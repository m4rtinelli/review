<title>Cronogramas Everest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500&display=swap">
<style>
/* Layout: barra fixa no topo, resumo de status que também filtra, calendário mensal (lista no celular), gaveta lateral com o post e os comentários.
   Tokens no padrão shadcn/ui (tema zinc, raio 0.5rem). Tipografia: Avenir regular. */
:root{
  --background:#FFFFFF; --foreground:#09090B; --muted:#F4F4F5; --muted-foreground:#71717A;
  --border:#E4E4E7; --primary:#18181B; --primary-foreground:#FAFAFA; --ring:#A1A1AA;
  --ok:#10B981; --wait:#F59E0B; --fix:#EF4444; --hold:#A1A1AA; --done:#3B82F6; --anim:#8B5CF6;
  --radius:.5rem;
  --font:"Avenir","Avenir Next","Avenir LT Std","Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 10px 38px rgba(9,9,11,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --background:#09090B; --foreground:#FAFAFA; --muted:#1F1F23; --muted-foreground:#A1A1AA;
  --border:#27272A; --primary:#FAFAFA; --primary-foreground:#18181B; --ring:#52525B;
  --ok:#34D399; --wait:#FBBF24; --fix:#F87171; --hold:#71717A; --done:#60A5FA; --anim:#A78BFA;
  --shadow:0 10px 38px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --background:#09090B; --foreground:#FAFAFA; --muted:#1F1F23; --muted-foreground:#A1A1AA;
  --border:#27272A; --primary:#FAFAFA; --primary-foreground:#18181B; --ring:#52525B;
  --ok:#34D399; --wait:#FBBF24; --fix:#F87171; --hold:#71717A; --done:#60A5FA; --anim:#A78BFA;
  --shadow:0 10px 38px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font);font-weight:400;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--background)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--background);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px}
.brand{min-width:0;flex:1 1 240px}
.brand small{display:block;font-size:12px;color:var(--muted-foreground)}
.brand h1{font-size:18px;font-weight:500;margin:0;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground)}
/* Tabs */
.seg{display:inline-flex;background:var(--muted);border-radius:var(--radius);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main.wrap{padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted-foreground);margin:0;max-width:75ch}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--muted);gap:2px}
.bar span{display:block;min-width:2px;border-radius:2px}
.tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.s-aprovado{--c:var(--ok)} .s-em_aprovacao{--c:var(--wait)} .s-ajuste{--c:var(--fix)}
.s-insumos{--c:var(--hold)} .s-postado{--c:var(--done)} .s-anim{--c:var(--anim)}
.s-none{--c:transparent}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.s-none .dot,.pill.s-none::before,.ev.s-none::before{box-shadow:inset 0 0 0 1px var(--ring)}
/* Badge (outline) */
.chip,.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--background);border-radius:999px;white-space:nowrap}
.chip{padding:4px 11px;font-size:13px}
.chip b{font-weight:400;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.chip:hover{background:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}
.pill{padding:1px 9px;font-size:12px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px}
.cal .dow{background:var(--background);padding:8px;font-size:12px;color:var(--muted-foreground)}
.day{background:var(--background);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.off{background:var(--muted)}
.day .num{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;padding:0 2px 2px}
.day.today .num{color:var(--primary-foreground);background:var(--primary);border-radius:999px;padding:0 7px;align-self:flex-start;margin-bottom:2px}
.ev{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;border-radius:calc(var(--radius) - 2px);padding:3px 6px;background:none;font-size:13px;min-width:0}
.ev::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.ev:hover,.row:hover{background:var(--muted)}
.ev span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ev .mk{font-size:11px;flex:none;color:var(--muted-foreground)}
.ev.dim,.row.dim{opacity:.25}

/* lista */
.list{display:flex;flex-direction:column;gap:20px}
.grp h2{font-size:13px;font-weight:400;color:var(--muted-foreground);margin:0 0 6px}
.rows{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:none;padding:8px 12px}
.row:first-child{border-top:0}
.row .th{width:30px;height:40px;border-radius:4px;flex:none;object-fit:cover;background:var(--muted);border:1px solid var(--border)}
.row .f{width:76px;flex:none}
.row .sum{flex:1 1 200px;min-width:0;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnt{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted-foreground)}

@media (max-width:760px){
  #cal{display:none}
  #list[hidden]{display:flex!important}
  #viewseg{display:none}
}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:21;background:var(--background);border-left:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px}
.dh h2{font-size:18px;font-weight:500;margin:0;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.dh small{display:block;font-size:13px;font-weight:400;color:var(--muted-foreground);letter-spacing:0}
.x{border:0;background:none;border-radius:calc(var(--radius) - 2px);width:30px;height:30px;font-size:18px;line-height:1;flex:none;color:var(--muted-foreground)}
.x:hover{background:var(--muted);color:var(--foreground)}
.db{overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:20px;flex:1}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl select,.tog{border:1px solid var(--border);background:var(--background);border-radius:calc(var(--radius) - 2px);padding:6px 10px;height:34px;font-size:13px}
.tog:hover{background:var(--muted)}
.tog[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.sec h3{font-size:13px;color:var(--muted-foreground);margin:0 0 6px;font-weight:400}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.sec a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.frames{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.frame{position:relative;flex:none;height:300px;border-radius:var(--radius);border:1px solid var(--border);cursor:crosshair;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--muted) 0 10px,var(--background) 10px 20px);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--muted-foreground)}
.frame.v{aspect-ratio:9/16} .frame.q{aspect-ratio:4/5}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.frame span.lb{position:relative;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--background);pointer-events:none}
.pin.new{background:var(--background);color:var(--foreground);box-shadow:0 0 0 2px var(--primary)}
.pin.ok{background:var(--ok);color:#fff}
.files{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sec a.file{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--border);text-decoration:none;font-size:13px}
.sec a.file:first-child{border-top:0}
.sec a.file:hover{background:var(--muted)}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .go{color:var(--muted-foreground);font-size:12px;white-space:nowrap}
.cm{display:flex;flex-direction:column;gap:8px}
.c{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.c.done{opacity:.55}
.c .hd{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted-foreground)}
.c .hd b{color:var(--foreground);font-weight:500;font-size:13px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--muted);color:var(--muted-foreground)}
.c p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{border:0;background:none;color:var(--foreground);padding:0;font-size:12px;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.df{border-top:1px solid var(--border);padding:12px 20px;display:flex;flex-direction:column;gap:8px}
.df textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:8px 10px;background:var(--background)}
.df textarea::placeholder{color:var(--muted-foreground)}
.df .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.df .r .pinmsg{font-size:12px;color:var(--muted-foreground);flex:1;min-width:0}
.btn{border:0;background:var(--primary);color:var(--primary-foreground);border-radius:calc(var(--radius) - 2px);padding:0 16px;height:34px;font-size:13px}
.btn:hover{opacity:.9}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}


/* ---------- visão macro: canvas de meses, interface em texto nos quatro cantos ---------- */
html.home,html.home body{height:100%;overflow:hidden;overscroll-behavior:none}
.board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.board.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:140px 150px;padding:80px;width:2600px;will-change:transform}
.cluster{all:unset;box-sizing:border-box;position:relative;display:block;cursor:pointer;flex:none}
.cluster .thumbs{display:flex;flex-wrap:wrap;gap:10px;width:1180px;align-items:flex-start}
.cluster .thumbs img{height:150px;object-fit:cover;max-width:none;display:block;border-radius:3px;pointer-events:none}
.cluster.empty{width:420px;height:300px;display:grid;place-items:center}
.mlabel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:500;letter-spacing:-.04em;line-height:1;white-space:nowrap;color:var(--foreground);
  text-shadow:0 0 0 var(--background),4px 0 0 var(--background),-4px 0 0 var(--background),0 4px 0 var(--background),0 -4px 0 var(--background),3px 3px 0 var(--background),-3px -3px 0 var(--background),3px -3px 0 var(--background),-3px 3px 0 var(--background)}
.mlabel sup{font-size:.28em;font-weight:400;color:var(--muted-foreground);letter-spacing:0;margin-left:6px;vertical-align:top;position:relative;top:.3em}
.cluster.empty .mlabel{color:var(--ring);font-size:84px}
.msub{position:absolute;left:50%;top:calc(50% + 78px);transform:translateX(-50%);white-space:nowrap;font-size:20px;background:var(--background);padding:2px 10px;color:var(--muted-foreground)}
.cluster.empty .msub{top:calc(50% + 56px);font-size:16px}
.cluster:hover .mlabel{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:10px}
.cluster:focus-visible{outline:3px solid var(--ring);outline-offset:20px}
.corner{position:fixed;z-index:3;background:var(--background);padding:4px 8px;font-size:14px;display:flex;align-items:center;gap:12px}
.corner.tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
.corner.tr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.corner.bl{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:calc(10px + env(safe-area-inset-left,0px));color:var(--muted-foreground);font-size:13px}
.corner.br{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.corner b{font-weight:500}.corner .mut{color:var(--muted-foreground)}
@media (max-width:640px){.corner.bl{display:none}.mebar .me span.nm{display:none}}

/* ---------- barra de perfil ---------- */
.mebar{display:flex;align-items:center;gap:14px;font-size:13px}
.tbtn{all:unset;cursor:pointer;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{color:var(--foreground)}
.tbtn:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.badge{background:var(--fix);color:#fff;border-radius:999px;font-size:11px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 5px}
.me{display:inline-flex;align-items:center;gap:7px}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
.banner{font-size:13px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--muted-foreground);margin:0}
.back{all:unset;cursor:pointer;color:var(--muted-foreground);font-size:13px}
.back:hover{color:var(--foreground)}

/* ---------- visão slides: um slide por post ---------- */
.slides{display:flex;flex-direction:column;gap:20px}
.slide{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);overflow:hidden;aspect-ratio:16/9;background:var(--background)}
.sl-l{padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow-y:auto}
.sl-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted-foreground)}
.sl-l h3{margin:0;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.sl-t h4{margin:0 0 3px;font-size:12px;font-weight:400;color:var(--muted-foreground)}
.sl-t p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.sl-t a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.sl-foot{margin-top:auto;padding-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.sl-r{background:var(--muted);display:flex;gap:12px;padding:22px;overflow-x:auto;align-items:stretch;min-width:0}
.sl-r .frame{height:auto;align-self:stretch;cursor:default}
.sl-r .frame:only-child{margin:0 auto}
.noart{margin:auto;color:var(--muted-foreground);font-size:13px}
.btn.ghost{background:none;color:var(--foreground);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--muted);opacity:1}
@media (max-width:820px){.slide{grid-template-columns:1fr;aspect-ratio:auto}.sl-r{height:340px;order:-1}.sl-l{padding:18px}}

/* ---------- mídia enviada, menções, painéis ---------- */
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.frame.dv{cursor:pointer;text-decoration:none;color:var(--foreground)}
.frame.dv .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:16px;padding-left:3px}
.frame.dv:hover .play{background:rgba(0,0,0,.85)}
.sl-r .frame.dv{cursor:pointer}
.frame .rm{all:unset;cursor:pointer;position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--background);border:1px solid var(--border);display:grid;place-items:center;font-size:13px;color:var(--foreground)}
.frame .vtag{position:absolute;top:6px;left:6px;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 6px;font-size:11px;color:var(--foreground)}
.up{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);margin-top:6px}
.up label{border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:5px 10px;cursor:pointer;color:var(--foreground);font-size:13px}
.up label:hover{background:var(--muted)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--muted);border-radius:999px;padding:1px 4px 1px 9px;font-size:12px}
.mchip button{all:unset;cursor:pointer;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;color:var(--muted-foreground)}
.at{color:var(--done)}
.mpick{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:190px;overflow-y:auto}
.mpick button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;cursor:pointer;font-size:13px}
.mpick button:hover,.mpick button:focus-visible{background:var(--muted)}
.mpick .none{padding:8px 10px;font-size:12px;color:var(--muted-foreground)}
.plist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);min-width:0}
.prow:first-child{border-top:0}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow select{border:1px solid var(--border);background:var(--background);border-radius:calc(var(--radius) - 2px);padding:4px 8px;font-size:13px}
button.prow{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer;width:100%}
button.prow:first-child{border-top:0}
button.prow:hover{background:var(--muted)}
.prow.unread .t{font-weight:500}
.prow .t{font-size:13px}.prow .s{font-size:12px;color:var(--muted-foreground);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--primary);color:var(--primary-foreground);padding:8px 14px;border-radius:var(--radius);font-size:13px;max-width:calc(100% - 32px)}
</style>

<div id="app"></div>
<div id="overlay"></div>

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function linkify(text){
  const out = []; let last = 0;
  for (const m of text.matchAll(/https?:\/\/[^\s]+/g)) {
    out.push(text.slice(last, m.index));
    out.push(h('a', {href:m[0], target:'_blank', rel:'noopener', text:m[0].replace(/^https?:\/\/(www\.)?/, '').slice(0, 48) + (m[0].length > 60 ? '…' : '')}));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last)); return out;
}

async function saveDoc(col, id, data){
  if (local) { S[col][id] = data; schedule(); return true; }
  try { await db.doc(col + '/' + id).set(data); return true; }
  catch (e) { toast(e && e.code === 'not_granted' ? 'Seu perfil não tem permissão para alterar isto.' : 'Não foi possível salvar. Tente de novo.'); return false; }
}

function resolveProfiles(){
  if (!user) return;
  const ids = new Set(Object.keys(S.members));
  Object.values(S.comments).forEach(c => { ids.add(c.by); (c.mentions || []).forEach(i => ids.add(i)); });
  Object.values(S.notifs).forEach(n => ids.add(n.by));
  const miss = [...ids].filter(i => i && !asked.has(i));
  if (!miss.length) return;
  miss.forEach(i => asked.add(i));
  user.profiles(miss).then(ps => { Object.assign(profiles, ps); schedule(true); });
}

  resolveProfiles(); schedule();
}

const pan = {ptr:new Map(), moved:false, d0:0};
function applyView(){ const w = $('#world'); if (!w) return; w.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; const z = $('#zoom'); if (z) z.textContent = Math.round(view.k * 100) + '%'; }
function fit(){
  const w = $('#world'); if (!w) return;
  const ww = w.offsetWidth, wh = w.offsetHeight;
  view.k = Math.min(innerWidth / ww, (innerHeight - 70) / wh, 1);
  view.x = (innerWidth - ww * view.k) / 2; view.y = (innerHeight - wh * view.k) / 2;

function zoomAt(cx, cy, f){ const k = Math.min(3, Math.max(.06, view.k * f)), r = k / view.k; view.x = cx - (cx - view.x) * r; view.y = cy - (cy - view.y) * r; view.k = k; applyView(); }
function bindBoard(b){
  b.addEventListener('pointerdown', e => { pan.ptr.set(e.pointerId, {x:e.clientX, y:e.clientY}); if (pan.ptr.size === 1) pan.moved = false; pan.d0 = 0; b.classList.add('drag'); });
  b.addEventListener('pointermove', e => {
    const p = pan.ptr.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (pan.ptr.size === 1) { if (Math.abs(dx) + Math.abs(dy) > 4) pan.moved = true; if (pan.moved) { view.x += dx; view.y += dy; applyView(); } }
    p.x = e.clientX; p.y = e.clientY;
    if (pan.ptr.size === 2) { const [a, c] = [...pan.ptr.values()], d = Math.hypot(a.x - c.x, a.y - c.y); if (pan.d0) zoomAt((a.x + c.x) / 2, (a.y + c.y) / 2, d / pan.d0); pan.d0 = d; pan.moved = true; }
  });
  const up = e => { pan.ptr.delete(e.pointerId); pan.d0 = 0; if (!pan.ptr.size) b.classList.remove('drag'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  b.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018))); }, {passive:false});
